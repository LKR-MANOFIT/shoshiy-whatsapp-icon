<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red Summer Dress — Shoshiy demo shop</title>

    <!-- Open Graph product metadata (fallback source). -->
    <meta property="og:type" content="product" />
    <meta property="og:title" content="Red Summer Dress" />
    <meta property="og:url" content="https://demo-shop.example.com/products/red-summer-dress" />
    <meta property="product:price:amount" content="499" />
    <meta property="product:price:currency" content="TRY" />

    <!-- JSON-LD product metadata (primary source; most themes emit this). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "Red Summer Dress",
        "sku": "DRS-RED-001",
        "brand": { "@type": "Brand", "name": "Shoshiy" },
        "url": "https://demo-shop.example.com/products/red-summer-dress",
        "offers": {
          "@type": "Offer",
          "price": "499",
          "priceCurrency": "TRY"
        }
      }
    </script>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 20px;
        color: #222;
        line-height: 1.6;
      }
      code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Red Summer Dress</h1>
    <p><strong>499 TRY</strong></p>
    <p>
      This is a product page. Click the WhatsApp button — the pre-filled message
      will include the product name, price, and this page's URL, pulled from the
      JSON-LD / Open Graph metadata above.
    </p>
    <p>👉 Set your own number in <code>data-phone</code> below to test sending.</p>

    <script
      src="../src/shoshiy-whatsapp.js"
      data-phone="905551112233"
      data-message="Hello! 👋 I have a question."
      data-product-message="Hello! 👋 I'd like to order *{product}*{priceSuffix}.%0A{url}"
      data-label="Order on WhatsApp"
      defer
    ></script>
  </body>
</html>
