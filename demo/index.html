<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shoshiy WhatsApp Icon — Home demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 20px;
        color: #222;
        line-height: 1.6;
      }
      code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Home page (no product)</h1>
    <p>
      This page has no product metadata, so clicking the WhatsApp button uses the
      generic <code>message</code>. Open
      <a href="./product.html">product.html</a> to see the dynamic product
      message.
    </p>
    <p>👉 Set your own number in <code>data-phone</code> below to test sending.</p>

    <!-- Load from the local source so you can hack on it. -->
    <script
      src="../src/shoshiy-whatsapp.js"
      data-phone="905551112233"
      data-message="Hello! 👋 I have a question about your shop."
      data-label="Chat with us"
      data-greeting="Hi! Need any help? 👋"
      defer
    ></script>
  </body>
</html>
